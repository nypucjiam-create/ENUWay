<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ENUWay оқу демосы</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #102a43; background: #f4f7fa; }
    body { max-width: 960px; margin: 0 auto; padding: 48px 20px; }
    header { margin-bottom: 32px; }
    h1 { margin: 0 0 10px; font-size: clamp(34px, 6vw, 58px); }
    p { color: #486581; line-height: 1.55; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .card { background: white; border: 1px solid #d9e2ec; border-radius: 16px; padding: 20px; }
    label { display: block; margin: 12px 0 5px; font-weight: 700; }
    input, select, button { width: 100%; box-sizing: border-box; padding: 11px; border-radius: 9px; border: 1px solid #9fb3c8; }
    button { margin-top: 16px; border: 0; background: #006d77; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { background: #9fb3c8; }
    .status { min-height: 24px; font-weight: 700; color: #006d77; }
  </style>
</head>
<body>
  <header>
    <h1>ENUWay</h1>
    <p>ЕҰУ қауымдастығына бірге сапар табуға арналған тексерілетін оқу инкременті.</p>
  </header>
  <main class="grid">
    <section class="card">
      <h2>Сапар іздеу</h2>
      <label for="origin">Бастапқы аудан</label>
      <select id="origin"><option>Сарыарқа</option><option>Есіл</option><option>Алматы</option></select>
      <label for="date">Күні</label>
      <input id="date" type="date" value="2026-11-13">
      <button id="search">Табу</button>
      <p id="search-status" class="status" aria-live="polite"></p>
    </section>
    <section class="card">
      <h2>Нәтиже</h2>
      <p><strong id="route">Сарыарқа → ЕҰУ</strong></p>
      <p>08:00 · 700 ₸ · <span id="seats">3</span> бос орын</p>
      <label for="passenger">Жолаушы</label>
      <input id="passenger" value="Тест қолданушы">
      <button id="book" disabled>Орын броньдау</button>
      <p id="book-status" class="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    const search = document.querySelector('#search');
    const book = document.querySelector('#book');
    const seats = document.querySelector('#seats');
    search.addEventListener('click', () => {
      const area = document.querySelector('#origin').value;
      document.querySelector('#route').textContent = `${area} → ЕҰУ`;
      document.querySelector('#search-status').textContent = '1 сәйкес сапар табылды';
      book.disabled = false;
    });
    book.addEventListener('click', () => {
      const passenger = document.querySelector('#passenger').value.trim();
      if (!passenger) {
        document.querySelector('#book-status').textContent = 'Жолаушы атын енгізіңіз';
        return;
      }
      const remaining = Math.max(0, Number(seats.textContent) - 1);
      seats.textContent = String(remaining);
      document.querySelector('#book-status').textContent = 'Бронь расталды';
      book.disabled = true;
    });
  </script>
</body>
</html>
