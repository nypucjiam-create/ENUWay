name: Функция
description: Пайдаланушыға құндылық беретін жаңа мүмкіндік
title: "[ENU-###] "
body:
  - type: textarea
    id: value
    attributes:
      label: Пайдаланушы құндылығы
      description: Кімге, қандай мәселені және не үшін шешеміз?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Given/When/Then немесе тексерілетін тізім түрінде жазыңыз.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Тәуекел деңгейі
      options: [Low, Medium, High]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Тексеру дәлелі
      description: Қандай тест, prototype немесе demo нәтижесі қажет?
    validations:
      required: true
