name: ENUWay PM status assistant

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 1"

permissions:
  contents: read

jobs:
  build-status-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start local model
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:11434/api/tags && break; sleep 2; done
          ollama pull qwen2.5:0.5b
      - name: Generate status draft from repository facts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/pm_status_assistant.py --provider ollama --model qwen2.5:0.5b
      - uses: actions/upload-artifact@v4
        with:
          name: pm-status-draft
          path: docs/pm-assistant/run/
